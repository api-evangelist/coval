overlay: 1.0.0
info:
  title: API Evangelist enhancements for Coval Agents API
  version: 1.0.0
extends: openapi/coval-agents-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-18'
    x-apievangelist-provider: coval
    x-api-evangelist: https://apievangelist.com
    x-agent-ready: true
- target: $.info
  update:
    x-authentication: api-key header X-API-Key
    x-error-envelope: google-style {error:{code,message,details}}
