  schemas:
    AgentVersionResource:
      type: object
      description: A single snapshot of an agent's behavioral config from its version history.
      required:
      - name
      - ulid
      - version_number
      - change_type
      - model_type
      - created_by
      properties:
        name:
          type: string
          description: Resource name
          example: agents/abc123def456ghi789jklm/versions/01KKWQYSF737ZN6X1Q1RYX8M2D
        ulid:
          type: string
          description: Version identifier (26-char ULID)
          example: 01KKWQYSF737ZN6X1Q1RYX8M2D
        version_number:
          type: integer
          description: Per-agent monotonic version number, 1-based
          example: 2
        change_type:
          type: string
          description: How this version came about. A revert is a save whose new state mirrors an older version.
          enum:
          - save
          - revert
        label:
          type: string
          nullable: true
          description: Optional user-supplied tag
          example: v1.2 prod
        model_type:
          type: string
          description: Agent model type at snapshot time
        phone_number:
          type: string
          nullable: true
        endpoint:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        attributes:
          type: object
          additionalProperties: true
          nullable: true
        workflows:
          type: object
          additionalProperties: true
          description: Verbatim workflow-config snapshot
        prompt:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        test_set_ids:
          type: array
          nullable: true
          items:
            type: string
        metric_ids:
          type: array
          nullable: true
          items:
            type: string
        created_by:
          type: string
          description: Who created this version (user ULID)
        create_time:
          type: string
          format: date-time
          nullable: true
          description: When this version became current
