          type: string
          nullable: true
          maxLength: 200
          description: 'Phone number in E.164 format (e.g., +12345678901) or SIP address (e.g., sip:user@domain.com).


            **Required for:**

            - MODEL_TYPE_VOICE agents (E.164 or SIP)

            - MODEL_TYPE_SMS agents (E.164 only)


            Optional for other agent types.

            '
          example: '+12345678901'
        endpoint:
          type: string
          nullable: true
          maxLength: 200
          description: 'Webhook endpoint URL that Coval will POST to.


            **Required for MODEL_TYPE_OUTBOUND_VOICE agents.**

            Must be a valid HTTP/HTTPS URL.

            '
          example: https://api.yourcompany.com/triggers/voice-simulation
        prompt:
          type: string
          nullable: true
          maxLength: 50000
          description: Agent instructions/system prompt
          example: You are a helpful customer support agent...
        customer_agent_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
          description: Your own external id for this agent. Defaults to the generated agent id when omitted.
          example: my-support-agent
        language:
          type: string
          nullable: true
          maxLength: 200
          description: Primary language for the agent
          example: en
        attributes:
          type: object
          nullable: true
          description: Free-form agent attributes; referenceable in metric prompts as `{{agent.<key>}}`.
          additionalProperties: true
          example:
            company_name: Acme Corp
        metadata:
          type: object
          description: "Simulator-specific configuration (JSONB, max 10MB).\n\n**For CHAT agents:**\n\n*Required:*\n- `chat_endpoint` - Chat endpoint URL (validated, no private IPs/localhost)\n\n*Authentication:*\n- `authorization_header` - Auth header (Bearer, X-API-Key, etc.)\n\n*Initialization:*\n- `initialization_endpoint` - Init endpoint called before chat (validated URL)\n- `initialization_payload` - JSON payload for init request (max 16KB)\n\n*Custom Data:*\n- `custom_data` - Organization/agent-level data (max 32KB JSON string)\n- `custom_persona_data` - Persona-specific data (max 16KB JSON string)\n\n*Headers & Format:*\n- `custom_headers` - Additional headers with template variables, as a JSON object or JSON-encoded object string (max 16KB when encoded)\n- `response_format` - \"chat_completions\" (default) or \"responses\"\n\n*Request/Response Processing:*\n- `input_template` - Custom JSON template for requests (validated JSON)\n- `payload_wrapper` - Wrapper field name (e.g., \"data\", \"request\")\n- `response_message_path` - Dot notation path to extract message\n- `strip_message_timestamps` - Remove timestamp fields (boolean, default: false)\n\n*Tool Calls:*\n- `tool_call_extraction_config` - Configuration for extracting tool calls from custom responses\n\n*Dynamic Configuration:*\n- `persona_id` - Reference persona for parameter substitution (22-char ShortUUID)\n\n*Template Variables:* `{{sessionId}}`, `{{simulation_output_id}}`, `{{init_response.path}}`, `{{persona.field}}`, `{{messages}}`, `{{latest_message}}`, `{{custom_data.field}}`\n\n**For OUTBOUND_VOICE agents:**\n- `trigger_call_headers` - JSON string with HTTP headers\n- `trigger_call_payload` - JSON string with base payload\n- `phone_number_key` - Field name for phone number (default: \"phone_number\")\n\n**For WEBSOCKET agents:**\n\n*Required:*\n- `endpoint` - WebSocket endpoint URL (must be wss://, validated). Required in `direct` connection mode.\n\n*Connection mode:*\n- `connection_mode` - `direct` (default) or `http_first`. In `http_first` mode Coval issues an HTTP request first and dials the WebSocket URL returned in the response.\n- `http_url`, `http_method`, `http_request_body`, `http_headers`, `websocket_url_response_path` - HTTP-first setup fields when `connection_mode=http_first`.\n\n*Authentication (optional):*\n- `authorization_header` - Auth header sent during the WebSocket handshake. Supports:\n  - `\"Bearer <token>\"` → sent as `Authorization: Bearer <token>`\n  - `\"Basic <base64-credentials>\"` → sent as `Authorization: Basic <base64-credentials>`\n  - `\"X-API-Key <key>\"` → sent as `X-API-Key: <key>`\n- `custom_headers` - JSON object or JSON-encoded object string of additional HTTP headers for the WebSocket handshake.\n\n*Initialization & handshake (optional):*\n- `initialization_json` - JSON object or JSON string payload sent after the WebSocket upgrade and before any ready-message wait.\n- `handshake_ready_message_type` - Message type to wait for before streaming audio (default `session_ready` in direct mode and empty in `http_first`; empty string skips the ready-message wait).\n- `handshake_requires_session_id` - Whether the ready message must include `session_id` (default `true` in direct mode and `false` in `http_first`).\n- `handshake_timeout_seconds` - Seconds Coval waits for the ready message (default `30`).\n\n*Audio format (optional):*\n- `send_audio_template` - JSON template for outbound audio. Must contain `{{audio_data}}`. Setting it exactly to `{{audio_data}}` sends raw PCM bytes (default `{\"type\":\"audio_chunk\",\"data\":\"{{audio_data}}\"}`).\n- `message_type_path` - Dot-notation path to the field naming the inbound message kind (default `type`).\n- `audio_message_type_value` - Value identifying an audio frame; use `*` to treat every JSON message as audio (default `audio_chunk`).\n- `audio_data_path` - Dot-notation path to the inbound base64 audio payload (default `data`).\n- `audio_encoding` - Inbound JSON audio payload encoding: `pcm` (default) or `mp3`.\n- `receive_audio_channels` - `1` for mono inbound JSON PCM or `2` for legacy stereo-to-mono averaging (default `2`).\n- `send_sample_rate_hertz` - Outbound sample rate. One of 8000, 16000, 24000, 48000 (default 16000).\n- `receive_sample_rate_hertz` - Inbound sample rate. One of 8000, 16000, 24000, 48000 (default 48000).\n- `pipeline_sample_rate_hertz` - Pipeline-internal rate; must remain 16000.\n- `pace_inbound_binary_audio` - Boolean, paces inbound binary PCM at real-time. Defaults on when outbound audio is configured for raw PCM bytes, off for JSON templates.\n- `send_media_template` - Outbound template for image attachments. Must contain `{{media_data}}`; may also include `{{media_name}}` and `{{mime_type}}`. Set exactly to `{{media_data}}` to send raw bytes, otherwise Coval base64-encodes the image into the JSON template.\n\n*Non-audio event capture (optional):*\n- `non_audio_event_message_types` - List of message-type values to emit as `WebsocketEventFrame`s instead of dropping. Each match carries the message type, optional `event` name, and original payload. Useful for cart updates, transcript fragments, or session telemetry.\n\n*Compatibility profile (optional):*\n- `websocket_compat_profile` - One of `generic` or `json_audio`. Forces the simulator routing decision. Use `json_audio` for the JSON audio preset shape.\n"
          additionalProperties: true
          default: {}
          example:
            chat_endpoint: https://api.example.com/v1/chat
            authorization_header: Bearer sk-xxx
        workflows:
          type: object
          description: Workflow configuration (JSONB, max 10MB)
          additionalProperties: true
          default: {}
          example: {}
        metric_ids:
          type: array
          description: Associated metric IDs (22-char IDs)
          items:
            type: string
            pattern: ^[A-Za-z0-9]{22}$
          default: []
          example:
          - abc123def456ghi789jklm
        test_set_ids:
          type: array
          description: Associated test set IDs (8-char IDs)
          items:
            type: string
            pattern: ^[A-Za-z0-9]{8}$
          default: []
          example:
          - gT5wq2Hn
        tags:
          type: array
          nullable: true
          description: Tags to associate with this agent. Null or omitted creates the agent with no tags. Pass [] for an empty tag list.
          items:
            type: string
          example:
          - production
          - voice
    AgentResource:
      type: object
      description: 'Agent configuration resource.


        Note: The `active` field (soft delete status) is managed internally and not exposed in API responses.

        '
      required:
      - customer_agent_id
      properties:
        id:
          type: string
          description: Agent resource ID
          pattern: ^[A-Za-z0-9]{22}$
          example: abc123def456ghi789jklm
        customer_agent_id:
          type: string
          description: Customer-supplied external id for the agent. Defaults to `id` when not set at creation.
          example: my-support-agent
        display_name:
          type: string
          description: Human-readable agent name
          minLength: 1
          maxLength: 200
          example: Customer Support Agent
        model_type:
          $ref: '#/components/schemas/SimulatorType'
        phone_number:
          type: string
          nullable: true
          description: Phone number in E.164 format or SIP address for voice/SMS agents
          maxLength: 200
          example: '+1234567890'
        endpoint:
          type: string
          nullable: true
          description: Custom API endpoint URL
          maxLength: 200
          example: https://api.example.com/agent
        prompt:
          type: string
          nullable: true
          description: Agent instructions/system prompt
          example: You are a helpful customer support agent...
        language:
          type: string
          nullable: true
          description: Primary language for the agent
          example: en
        attributes:
          type: object
          nullable: true
          description: Free-form agent attributes; referenceable in metric prompts as `{{agent.<key>}}`.
          additionalProperties: true
          example:
            company_name: Acme Corp
            tier: enterprise
        metadata:
          type: object
          description: Simulator-specific configuration (JSONB)
          additionalProperties: true
          example:
            voice: alloy
            model: gpt-realtime-2
        workflows:
          type: object
          description: Workflow configuration (JSONB)
          additionalProperties: true
          example: {}
        metric_ids:
          type: array
          description: Associated metric IDs
          items:
            type: string
          example:
          - abc123def456ghi789jklm
          - def456ghi789jklmabc123
        test_set_ids:
          type: array
          description: Associated test set IDs
          items:
            type: string
          example:
          - gT5wq2Hn
        knowledge_base_ids:
          type: array
          description: Associated knowledge base entry IDs (read-only, derived from reverse FK)
          readOnly: true
          items:
            type: string
          example: []
        tags:
          type: array
          description: Tags associated with this agent
          items:
            type: string
          default: []
          example:
          - production
          - voice
        create_time:
          type: string
          format: date-time
          description: Creation timestamp (ISO 8601)
          example: '2025-10-14T12:00:00Z'
        update_time:
          type: string
          format: date-time
          nullable: true
          description: Last update timestamp (ISO 8601)
          example: '2025-10-15T14:30:00Z'
