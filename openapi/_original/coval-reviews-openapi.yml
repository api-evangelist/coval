openapi: 3.0.3
x-visibility: external  # external | internal — only `external` specs are published to the public API/docs
info:
  title: Coval Reviews API
  version: 1.0.0
  description: |
    Manage human review annotations and projects for AI evaluation quality assurance.

    **Annotations** are individual review tasks assigned to reviewers, linked to a
    simulation output and metric. Reviewers provide ground-truth values and notes.

    **Projects** group annotations by linking sets of simulations, metrics, and
    assignees. Creating a project auto-generates annotations for every
    (simulation, metric, assignee) combination.

    Key concepts:
    - Ground truth updates auto-complete annotations (FR-4)
    - Resource naming: `review-annotations/{id}`, `review-projects/{id}`
  contact:
    name: Coval API Support
    email: support@coval.dev
    url: https://docs.coval.ai
  license:
    name: Proprietary
    url: https://coval.dev/terms
servers:
  - url: https://api.coval.dev/v1
    description: Production API
tags:
  - name: Review Annotations
    description: Annotation CRUD operations
  - name: Review Projects
    description: Project CRUD operations
security:
  - ApiKeyAuth: []
paths:
  # =========================================================================
  # Review Annotations
  # =========================================================================
  /review-annotations:
    get:
      operationId: listReviewAnnotations
      summary: List review annotations
      description: List review annotations for your organization with optional filtering, sorting, and pagination.
      tags:
        - Review Annotations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of results per page
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: Opaque pagination token from previous response
        - name: order_by
          in: query
          required: false
          schema:
            type: string
            example: -create_time
          description: |
            Sort field and direction. Prefix with `-` for descending.
            Valid fields: `create_time`, `update_time`, `assignee`, `priority`.
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: |
            Filter expression. Supported fields:
            - `simulation_output_id` — exact match
            - `metric_id` — exact match
            - `assignee` — exact match
            - `status` — `ACTIVE` or `ARCHIVED`
            - `completion_status` — `PENDING` or `COMPLETED`
            - `project_id` — annotations belonging to a project
      responses:
        "200":
          description: Annotations retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListReviewAnnotationsResponse"
              examples:
                success:
                  $ref: "#/components/examples/ListAnnotationsSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createReviewAnnotation
      summary: Create review annotation
      description: Create a new review annotation for your organization.
      tags:
        - Review Annotations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
          description: Optional project ID to apply project-rule-aware completion status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewAnnotationRequest"
            examples:
              basic:
                summary: Create a basic annotation
                value:
                  simulation_output_id: sim-output-abc123
                  metric_id: metric-accuracy-001
                  assignee: reviewer@company.com
              with_ground_truth:
                summary: Create with ground truth (auto-completes)
                value:
                  simulation_output_id: sim-output-abc123
                  metric_id: metric-accuracy-001
                  assignee: reviewer@company.com
                  ground_truth_float_value: 0.95
                  reviewer_notes: Verified correct response
      responses:
        "201":
          description: Annotation created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReviewAnnotationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /review-annotations/{annotation_id}:
    get:
      operationId: getReviewAnnotation
      summary: Get review annotation
      description: Get a single review annotation by ID.
      tags:
        - Review Annotations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: annotation_id
          in: path
          required: true
          schema:
            type: string
          description: The annotation ID
        - name: project_id
          in: query
          required: false
          schema:
            type: string
          description: Optional project ID to apply project-rule-aware completion status
      responses:
        "200":
          description: Annotation retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetReviewAnnotationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateReviewAnnotation
      summary: Update review annotation
      description: |
        Partially update a review annotation.
        Providing a ground truth value auto-sets `completion_status` to `COMPLETED`.
      tags:
        - Review Annotations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: annotation_id
          in: path
          required: true
          schema:
            type: string
          description: The annotation ID
        - name: project_id
          in: query
          required: false
          schema:
            type: string
          description: Optional project ID to apply project-rule-aware completion status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReviewAnnotationRequest"
            examples:
              set_ground_truth:
                summary: Set ground truth (auto-completes)
                value:
                  ground_truth_float_value: 0.85
              update_assignee:
                summary: Reassign annotation
                value:
                  assignee: new-reviewer@company.com
      responses:
        "200":
          description: Annotation updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateReviewAnnotationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteReviewAnnotation
      summary: Delete review annotation
      description: Delete a review annotation.
      tags:
        - Review Annotations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: annotation_id
          in: path
          required: true
          schema:
            type: string
          description: The annotation ID
      responses:
        "200":
          description: Annotation deleted successfully
          content:
            application/json:
              schema:
                type: object
              example: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  # =========================================================================
  # Review Projects
  # =========================================================================
  /review-projects:
    get:
      operationId: listReviewProjects
      summary: List review projects
      description: List review projects for your organization with pagination.
      tags:
        - Review Projects
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of results per page
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: Opaque pagination token from previous response
        - name: order_by
          in: query
          required: false
          schema:
            type: string
            example: -create_time
          description: |
            Sort field and direction. Prefix with `-` for descending.
            Valid fields: `create_time`, `update_time`, `display_name`.
      responses:
        "200":
          description: Projects retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListReviewProjectsResponse"
              examples:
                success:
                  $ref: "#/components/examples/ListProjectsSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createReviewProject
      summary: Create review project
      description: |
        Create a new review project. Automatically generates annotations for every
        (simulation, metric, assignee) combination.
      tags:
        - Review Projects
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewProjectRequest"
            examples:
              basic:
                summary: Create a project
                value:
                  display_name: Q1 Voice Agent Review
                  assignees:
                    - alice@company.com
                    - bob@company.com
                  linked_simulation_ids:
                    - sim-output-001
                    - sim-output-002
                  linked_metric_ids:
                    - metric-accuracy
                    - metric-latency
      responses:
        "201":
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReviewProjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /review-projects/{project_id}:
    get:
      operationId: getReviewProject
      summary: Get review project
      description: Get a single review project by ID.
      tags:
        - Review Projects
      security:
        - ApiKeyAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
          description: The project ID (ULID)
      responses:
        "200":
          description: Project retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetReviewProjectResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateReviewProject
      summary: Update review project
      description: Partially update a review project.
      tags:
        - Review Projects
      security:
        - ApiKeyAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
          description: The project ID (ULID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReviewProjectRequest"
            examples:
              update_name:
                summary: Update project name
                value:
                  display_name: Updated Project Name
              update_assignees:
                summary: Update assignees
                value:
                  assignees:
                    - alice@company.com
                    - charlie@company.com
      responses:
        "200":
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateReviewProjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteReviewProject
      summary: Delete review project
      description: Delete a review project. This permanently removes the project record.
      tags:
        - Review Projects
      security:
        - ApiKeyAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
          description: The project ID (ULID)
      responses:
        "200":
          description: Project deleted successfully
          content:
            application/json:
              schema:
                type: object
              example: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /review-projects/{project_id}/metric-agreement:
    get:
      operationId: getReviewProjectMetricAgreement
      summary: Get project metric agreement
      description: >-
        Machine-vs-human agreement by metric for one review project. The project resolves to its
        linked simulations and metrics; agreement is computed over that derived scope.
      tags:
        - Review Projects
      security:
        - ApiKeyAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
          description: The project ID (ULID)
      responses:
        "200":
          description: Agreement computed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetProjectMetricAgreementResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /review-projects/{project_id}/insights:
    get:
      operationId: getReviewProjectInsights
      summary: Get project insights
      description: >-
        Project-level human-review insights (label and metric stats) over a date range.
      tags:
        - Review Projects
      security:
        - ApiKeyAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
          description: The project ID (ULID)
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Start of the insights window (ISO-8601).
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: End of the insights window (ISO-8601); must be after start_date.
        - name: label_triage_time_basis
          in: query
          required: false
          schema:
            type: string
            enum: [simulation, label]
            default: simulation
          description: Whether label triage timing is anchored to the simulation or the label.
      responses:
        "200":
          description: Insights computed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetHumanReviewProjectInsightsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /review-annotations/metric-health-stats:
    get:
      operationId: getReviewMetricHealthStats
      summary: Get metric health stats
      description: >-
        Compact machine-vs-human and human-vs-human agreement health for one metric, computed from
        its review annotations. Metric-scoped (no project).
      tags:
        - Review Annotations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: metric_id
          in: query
          required: true
          schema:
            type: string
          description: The metric ID (22-char ShortUUID).
      responses:
        "200":
          description: Health stats computed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMetricHealthStatsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /review-annotations:withMetricOutputs:
    post:
      operationId: getReviewAnnotationsWithMetricOutputs
      summary: Get annotations with metric outputs
      description: >-
        Review annotations grouped by metric plus the latest pipeline metric outputs, scoped by any
        of metric_ids / simulation_output_ids / project_ids (all optional). Offset-paginated via
        page_token / page_size.
      tags:
        - Review Annotations
      security:
        - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetAnnotationsWithMetricOutputsRequest"
      responses:
        "200":
          description: Annotations retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAnnotationsWithMetricOutputsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
# ===========================================================================
# Components
# ===========================================================================
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Organization API key for authentication
  schemas:
    # -----------------------------------------------------------------------
    # Human-review result reads
    # -----------------------------------------------------------------------
    ProjectMetricAgreementResource:
      type: object
      required: [metric_id, agreements, disagreements, agreement_rate]
      properties:
        metric_id:
          type: string
        agreements:
          type: integer
        disagreements:
          type: integer
        agreement_rate:
          type: number
    GetProjectMetricAgreementResponse:
      type: object
      required: [agreement_by_metric_id]
      properties:
        agreement_by_metric_id:
          type: object
          description: Agreement stats keyed by metric ID.
          additionalProperties:
            $ref: "#/components/schemas/ProjectMetricAgreementResource"
    HumanAgreementStatsResource:
      type: object
      required: [human_agreement_rate, human_agreement_total, human_agreements, human_disagreements]
      properties:
        human_agreement_rate:
          type: number
        human_agreement_total:
          type: integer
        human_agreements:
          type: integer
        human_disagreements:
          type: integer
    GetMetricHealthStatsResponse:
      type: object
      required: [conversations, annotations, agreement_rate, agreements, disagreements, human_agreement]
      properties:
        conversations:
          type: integer
        annotations:
          type: integer
        agreement_rate:
          type: number
        agreements:
          type: integer
        disagreements:
          type: integer
        human_agreement:
          $ref: "#/components/schemas/HumanAgreementStatsResource"
    # The insights + annotations-with-metric-outputs response shapes are documented here for the
    # public contract; full structural parity registration of their deep nested resources is a
    # tracked follow-up (they reuse ReviewAnnotationResource, already modeled above).
    GetHumanReviewProjectInsightsResponse:
      type: object
      required: [project, label_overview, label_stats, metric_stats]
      properties:
        project:
          type: object
          properties:
            ulid: { type: string }
            name: { type: string }
            linked_metric_ids: { type: array, items: { type: string } }
            review_label_options: { type: array, items: { type: string } }
        label_overview:
          type: object
          description: Aggregate label coverage for the project window.
        label_stats:
          type: array
          items:
            type: object
          description: Per-label insight rows.
        metric_stats:
          type: array
          items:
            type: object
          description: Per-metric insight rows (counts, agreement rate, simulation output ids).
    ReviewMetricOutputForAnnotationResource:
      type: object
      required: [created_at]
      properties:
        output_type: { type: string, nullable: true }
        float_value: { type: number, nullable: true }
        string_value: { type: string, nullable: true }
        set_value: { type: array, nullable: true, items: { type: string } }
        error_status: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        explanation: { type: string, nullable: true }
        result_json: { nullable: true }
        subvalues_by_timestamp: { nullable: true }
        metric_version_number: { type: integer, nullable: true }
        metric_version_ulid: { type: string, nullable: true }
    GetAnnotationsWithMetricOutputsRequest:
      type: object
      additionalProperties: false
      properties:
        metric_id: { type: string, nullable: true }
        metric_ids: { type: array, nullable: true, maxItems: 10000, items: { type: string } }
        simulation_output_ids: { type: array, nullable: true, maxItems: 10000, items: { type: string } }
        project_ids: { type: array, nullable: true, maxItems: 1000, items: { type: string } }
        filter_archived: { type: boolean, default: false }
        include_metric_output_details: { type: boolean, default: true }
        include_audio_lengths: { type: boolean, default: true }
        page_size: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
        page_token: { type: string, nullable: true }
    GetAnnotationsWithMetricOutputsResponse:
      type: object
      required: [annotations, metric_outputs, audio_lengths_by_simulation_output_id]
      properties:
        annotations:
          type: object
          description: Annotations keyed by metric ID.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/ReviewAnnotationResource"
        metric_outputs:
          type: object
          description: Latest pipeline metric output keyed by metric ID then simulation output ID.
          additionalProperties:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/ReviewMetricOutputForAnnotationResource"
        audio_lengths_by_simulation_output_id:
          type: object
          additionalProperties:
            type: number
            nullable: true
        next_page_token:
          type: string
          nullable: true
    # -----------------------------------------------------------------------
    # Annotation schemas
    # -----------------------------------------------------------------------
    ReviewAnnotationResource:
      type: object
      description: A single review annotation resource.
      required:
        - name
        - id
        - simulation_output_id
        - metric_id
        - assignee
        - status
        - completion_status
        - priority
        - create_time
        - update_time
      properties:
        name:
          type: string
          description: "Resource name: review-annotations/{id}"
          example: review-annotations/abc123def456ghi789jklm
        id:
          type: string
          description: Unique annotation ID
          example: abc123def456ghi789jklm
        simulation_output_id:
          type: string
          description: Linked simulation output ID
        metric_id:
          type: string
          description: Linked metric ID
        assignee:
          type: string
          description: Email of the assigned reviewer
        ground_truth_float_value:
          type: number
          format: float
          nullable: true
          description: Reviewer-provided ground truth numeric value
        ground_truth_string_value:
          type: string
          nullable: true
          description: Reviewer-provided ground truth string value
        ground_truth_subvalues_by_timestamp:
          type: array
          nullable: true
          description: Reviewer-provided ground truth subvalues keyed by timestamp
          items:
            type: object
        reviewer_notes:
          type: string
          nullable: true
          description: Free-text reviewer notes
        status:
          $ref: "#/components/schemas/AnnotationStatus"
        completion_status:
          $ref: "#/components/schemas/CompletionStatus"
        priority:
          $ref: "#/components/schemas/AnnotationPriority"
        create_time:
          type: string
          format: date-time
          description: Creation timestamp (ISO 8601)
        update_time:
          type: string
          format: date-time
          description: Last update timestamp (ISO 8601)
    CreateReviewAnnotationRequest:
      type: object
      required:
        - simulation_output_id
        - metric_id
        - assignee
      properties:
        simulation_output_id:
          type: string
          minLength: 1
          description: Simulation output ID to link
        metric_id:
          type: string
          minLength: 1
          description: Metric ID to link
        assignee:
          type: string
          minLength: 1
          description: Email of the reviewer to assign
        ground_truth_float_value:
          type: number
          format: float
          nullable: true
          description: Optional ground truth numeric value (auto-completes annotation)
        ground_truth_string_value:
          type: string
          nullable: true
          description: Optional ground truth string value (auto-completes annotation)
        ground_truth_subvalues_by_timestamp:
          type: array
          nullable: true
          items:
            type: object
          description: Optional ground truth subvalues
        reviewer_notes:
          type: string
          nullable: true
          description: Optional reviewer notes
        priority:
          $ref: "#/components/schemas/AnnotationPriority"
    UpdateReviewAnnotationRequest:
      type: object
      properties:
        ground_truth_float_value:
          type: number
          format: float
          nullable: true
          description: Ground truth numeric value (auto-completes annotation)
        ground_truth_string_value:
          type: string
          nullable: true
          description: Ground truth string value (auto-completes annotation)
        ground_truth_subvalues_by_timestamp:
          type: array
          nullable: true
          items:
            type: object
          description: Ground truth subvalues
        reviewer_notes:
          type: string
          nullable: true
          description: Reviewer notes
        priority:
          $ref: "#/components/schemas/AnnotationPriority"
        assignee:
          type: string
          nullable: true
          description: Reassign to a different reviewer
    ListReviewAnnotationsResponse:
