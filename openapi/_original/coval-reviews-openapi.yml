    # -----------------------------------------------------------------------
    # Enums
    # -----------------------------------------------------------------------
    AnnotationStatus:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED
      description: "Annotation lifecycle status: ACTIVE (default) or ARCHIVED"
    CompletionStatus:
      type: string
      enum:
        - PENDING
        - COMPLETED
      description: "Annotation completion status: PENDING or COMPLETED"
    AnnotationPriority:
      type: string
      enum:
        - PRIORITY_PRIMARY
        - PRIORITY_STANDARD
      default: PRIORITY_STANDARD
      description: "Annotation priority level"
    ProjectType:
      type: string
      enum:
        - PROJECT_COLLABORATIVE
        - PROJECT_INDIVIDUAL
      default: PROJECT_INDIVIDUAL
      description: "Project type: COLLABORATIVE (shared annotations) or INDIVIDUAL (per-assignee annotations)"
    ProjectRule:
      type: string
      enum:
        - require_disagreement_notes
      description: "Project rule: require_disagreement_notes requires reviewer notes when ground truth disagrees with model output"
    # -----------------------------------------------------------------------
    # Error
    # -----------------------------------------------------------------------
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code
              example: INVALID_ARGUMENT
            message:
              type: string
              description: Human-readable error message
              example: Invalid request parameter
            details:
              type: array
              description: Detailed error information
              items:
                type: object
                properties:
                  field:
                    type: string
                    nullable: true
                    description: Field that caused the error
                  description:
                    type: string
                    description: Detailed error description
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INVALID_ARGUMENT
              message: Invalid request body
              details:
                - field: simulation_output_id
                  description: simulation_output_id is required
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHENTICATED
              message: Authentication failed
              details:
                - field: X-API-Key
                  description: Invalid or missing API key
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: PERMISSION_DENIED
              message: Insufficient permissions
              details:
                - field: permissions
                  description: The API key does not include the required reviews permission.
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: Resource not found
              details:
                - field: annotation_id
                  description: Annotation not found or not accessible by your organization
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL
              message: Internal server error
              details:
                - description: An unexpected error occurred
    ServiceUnavailable:
      description: Service temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL
              message: Service temporarily unavailable
              details:
                - description: Database routing is temporarily unavailable. Please retry.
