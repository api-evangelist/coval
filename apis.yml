aid: coval
name: Coval
description: >-
  Coval is the deployment-readiness platform for voice and chat AI agents. Teams simulate
  thousands of realistic conversation scenarios before launch, monitor real production calls,
  and improve reliability with metrics and human review. Coval supports inbound/outbound voice,
  standard chat, chat over WebSocket, chat A2A (JSON-RPC), voice-to-voice models (OpenAI Realtime,
  Gemini Live), SMS, Pipecat, and LiveKit agents. Its v1 REST API, TypeScript and Python SDKs,
  Homebrew CLI, and hosted MCP server let developers connect agents, define personas and test sets,
  launch simulation runs, ingest production conversations and OpenTelemetry traces, define
  deterministic/statistical/ML/LLM-judge metrics, and route critical calls to human reviewers.
  Coval is backed by General Catalyst and is SOC 2 Type II, GDPR, and HIPAA compliant.
